<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Star Sounds 3D - The Musical Web</title>
	<link rel="stylesheet" href="/libraries/glassmorphic.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.25/Tone.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
	<script src="/starsounds3d/sketch-with-sound-with-effects-3d.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #181818;
            font-family: 'IvyEpic', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
		}

		canvas {
			margin: auto;
		}

        .link {
            color: var(--text-primary);
            text-decoration: none;
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem;
        }

		/* Project-specific glassmorphic elements */
		.glass-project-info {
			position: fixed;
			top: 2rem;
			left: 2rem;
			z-index: 1000;
			max-width: 300px;
		}

		.glass-controls {
			position: fixed;
			top: 2rem;
			right: 2rem;
			z-index: 1000;
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		.glass-camera-controls {
			position: fixed;
			bottom: 2rem;
			left: 2rem;
			z-index: 1000;
			max-width: 300px;
		}
	</style>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-04VDK5DXZS"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());
	  gtag('config', 'G-04VDK5DXZS');
	</script>
</head>

<body>
    <!-- Glassmorphic Navigation -->
    <div class="glass-nav">
      <a href="/" class="glass-text-primary">← Back to Portfolio</a>
      <a href="/starsounds2d" class="glass-text-secondary">📐 2D View</a>
    </div>

    <!-- Glassmorphic Project Info -->
    <div class="glass-project-info">
      <div class="glass-card">
        <h3 style="margin: 0 0 1rem 0; color: var(--text-primary);">Star Sounds 3D</h3>
        <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">
          Immersive 3D audio-reactive star field with intelligent camera movement.
        </p>
      </div>
    </div>

    <!-- Glassmorphic Controls -->
    <div class="glass-controls">
      <div class="glass-status" id="star3dStatus">
        <span>3D Star Field Active</span>
      </div>
    </div>

    <!-- Glassmorphic Camera Controls -->
    <div class="glass-camera-controls">
      <div class="glass-card">
        <h4 style="margin: 0 0 1rem 0; color: var(--text-primary);">Camera Controls</h4>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button class="glass-button" onclick="toggleCameraMovement()">🎥 Toggle Camera</button>
          <button class="glass-button" onclick="resetCamera()">🔄 Reset Camera</button>
          <button class="glass-button" onclick="toggleStarAudio3d()">🎵 Toggle Audio</button>
        </div>
      </div>
    </div>

    <a class="glass-button" href="/starsounds2d" target="_parent">📐 See 2d</a>

    <script>
      function toggleCameraMovement() {
        // This would be implemented in the sketch.js file
        console.log('Toggle camera movement');
      }
      
      function resetCamera() {
        // This would be implemented in the sketch.js file
        console.log('Reset camera');
      }

      function toggleStarAudio3d() {
        // This would be implemented in the sketch.js file
        console.log('Toggle 3D star audio');
      }
    </script>
    <!-- Glassmorphic UI Controller -->
    <script src="/libraries/glassmorphic-ui.js"></script>
</body>
</html>
